[project]
name = "gadfly"
version = "0.1.0"
description = "Watchdog over Claude Code sessions that flags non-professional shortcuts via Haiku"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
gadfly-view = "gadfly.viewer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gadfly"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
# `live` tests spawn the real Claude Code CLI and bill against the user's
# subscription — gated behind `GADFLY_LIVE=1` so a routine pytest run does
# not surprise-cost the user. Run with: `GADFLY_LIVE=1 pytest -m live`.
markers = [
    "live: hits the real Anthropic Haiku via claude-agent-sdk; off by default",
]
